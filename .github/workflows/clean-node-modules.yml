name: Clean Node Modules from Git

on:
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Use default token for push

      - name: Update .gitignore
        run: |
          echo "node_modules/" >> .gitignore
          git add .gitignore
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove node_modules from Git
        run: |
          git rm -r --cached node_modules || true  # Ignore if already removed
          git add .

      - name: Commit and push changes
        run: |
          git commit -m "Remove node_modules from tracking and update .gitignore" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}